<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Daily News</title><style>body{font-family:system-ui,'Malgun Gothic',sans-serif;margin:0;background:#f4f7fc;color:#19304e}header{background:#15457e;color:white;padding:30px}main{max-width:960px;margin:25px auto;padding:0 18px}input{padding:12px;width:95%;border:1px solid #cad5e5;border-radius:9px}button{padding:10px;margin:5px 4px 12px 0;background:white;border:1px solid #cdd8e8;border-radius:8px;cursor:pointer}.active{background:#2169bc;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{background:white;padding:18px;border-radius:12px;border:1px solid #e1e9f4}.tag{color:#2469b5;font-size:12px;font-weight:bold}.card a{display:block;margin:10px 0;color:#19304e;font-weight:bold;text-decoration:none}.source,#status{color:#697c94;font-size:13px}</style></head><body><header><h1>🗞️ My Daily News</h1><p>반도체 · 국내 주식 · 미국 주식 · 경제 · AI 기술</p></header><main><input id="search" placeholder="기사 제목 검색"><div id="filters"></div><p id="status">뉴스 불러오는 중...</p><div class="grid" id="news"></div></main><script>let groups={},selected='전체';const filters=document.querySelector('#filters'),news=document.querySelector('#news'),status=document.querySelector('#status'),search=document.querySelector('#search');function render(){filters.replaceChildren();for(const c of ['전체',...Object.keys(groups)]){let b=document.createElement('button');b.textContent=c;b.className=c===selected?'active':'';b.onclick=()=>{selected=c;render()};filters.append(b)}news.replaceChildren();for(const [cat,items] of Object.entries(groups)){if(selected!=='전체'&&selected!==cat)continue;for(const a of items){if(!a.title.toLowerCase().includes(search.value.toLowerCase()))continue;let card=document.createElement('article');card.className='card';let tag=document.createElement('div');tag.className='tag';tag.textContent=cat;let link=document.createElement('a');link.textContent=a.title;link.href=a.url;link.target='_blank';link.rel='noopener noreferrer';let src=document.createElement('div');src.className='source';src.textContent=a.source+' · '+a.published;card.append(tag,link,src);news.append(card)}}if(!news.children.length)news.textContent='표시할 기사가 없습니다.'}search.addEventListener('input',render);fetch('./news.json?t='+Date.now()).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{groups=data.categories||{};status.textContent='최근 수집: '+(data.updated_at||'알 수 없음')+' · '+Object.values(groups).flat().length+'건';render()}).catch(e=>status.textContent='뉴스를 불러오지 못했습니다. 먼저 python news.py를 실행하세요. '+e.message)</script></body></html>
